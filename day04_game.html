<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Olympiad Camp · Day 4</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math Camp">
<meta name="theme-color" content="#0f1420">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html{font-size:18px}  /* runtime zoom overrides this */
:root{
  --bg:#0f1420; --panel:#182134; --panel2:#1f2b42; --line:#2c3a56;
  --ink:#e8edf7; --dim:#9fb0cc; --accent:#4cc3a5; --accent2:#5aa9f0;
  --warn:#f0a35a; --bad:#ef6f6f; --gold:#f5cc4d; --purple:#a98bdc;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.wrap{max-width:min(96vw,49rem);margin:0 auto;padding:1rem}
header{position:sticky;top:0;z-index:20;background:rgba(15,20,32,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.hbar{max-width:min(96vw,49rem);margin:0 auto;padding:.5rem 1rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:700;font-size:1rem}
.logo small{display:block;font-weight:400;font-size:0.6875rem;color:var(--dim);letter-spacing:.5px}
.rank{font-size:0.75rem;padding:3px 10px;border-radius:99px;border:1px solid var(--gold);color:var(--gold)}
.stats{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:0.8125rem}
.stat b{font-size:1rem;color:var(--gold)}
.mute{padding:.3rem .55rem;font-size:.78rem}
.zlab{font-size:.72rem;color:var(--dim);min-width:2.6rem;text-align:center;font-variant-numeric:tabular-nums}
.xpwrap{width:100%;height:5px;background:var(--panel2);border-radius:99px;overflow:hidden}
.xpbar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
h1{font-size:1.375rem;margin:20px 0 4px}
h2{font-size:1.125rem;margin:24px 0 8px}
h3{font-size:0.9375rem;margin:16px 0 6px;color:var(--accent)}
p{margin:8px 0}
.sub{color:var(--dim);font-size:0.8125rem;margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.card.quiet{background:var(--panel2)}
.grid{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr))}
.lvl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;cursor:pointer;
  transition:transform .12s,border-color .2s;position:relative}
.lvl:hover{transform:translateY(-2px);border-color:var(--accent)}
.lvl.locked{opacity:.4;cursor:not-allowed}.lvl.locked:hover{transform:none;border-color:var(--line)}
.lvl.game{border-color:#3a3156;background:linear-gradient(160deg,#1d1b33,#182134)}
.lvl.game:hover{border-color:var(--purple)}
.lvl .ico{font-size:1.5625rem}.lvl .nm{font-weight:650;margin-top:5px}
.lvl .en{font-size:0.6875rem;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
.lvl .st{margin-top:8px;font-size:0.875rem;letter-spacing:2px;color:var(--gold)}
.lvl .tag{position:absolute;top:11px;right:12px;font-size:0.6875rem;color:var(--dim)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:.5rem .85rem;transition:.15s}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#06241c;border-color:var(--accent);font-weight:650}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:13px}
.q{font-size:1.875rem;font-weight:600;letter-spacing:1px;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.q.word{font-size:1.1875rem;font-weight:500;letter-spacing:0;line-height:1.5}
.qsub{color:var(--dim);font-size:0.8125rem}
input[type=text]{font:inherit;font-size:1.3125rem;padding:.55rem .8rem;border-radius:10px;width:9.5rem;
  border:1px solid var(--line);background:#0c111c;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
input#expr{width:100%;max-width:26rem;text-align:left;letter-spacing:1px}
input[type=text]:focus{outline:none;border-color:var(--accent2)}
.pbar{height:5px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:13px 0 4px}
.pbar i{display:block;height:100%;background:var(--accent2);width:0;transition:width .3s}
.fb{margin-top:13px;padding:13px 15px;border-radius:12px;font-size:0.875rem;display:none}
.fb.ok{display:block;background:rgba(76,195,165,.13);border:1px solid rgba(76,195,165,.4)}
.fb.no{display:block;background:rgba(239,111,111,.12);border:1px solid rgba(239,111,111,.4)}
.fb ol{margin:8px 0 0 18px;padding:0}.fb li{margin:3px 0}
.combo{font-size:0.8125rem;color:var(--warn)}
.opts{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));margin-top:.8rem}
.opt{padding:13px;text-align:center;font-size:1.1875rem;font-variant-numeric:tabular-nums}
.hl{color:var(--gold);font-weight:650}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.5px}
table{width:100%;border-collapse:collapse;font-size:0.875rem;margin-top:10px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:500;font-size:0.75rem;text-transform:uppercase;letter-spacing:.5px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:0.75rem;
  background:var(--panel2);border:1px solid var(--line);margin:3px 4px 3px 0}
.badge.got{background:rgba(245,204,77,.15);border-color:var(--gold);color:var(--gold)}
.toast{position:fixed;left:50%;top:66px;transform:translateX(-50%) translateY(-16px);
  background:var(--accent);color:#06241c;font-weight:650;padding:10px 20px;border-radius:99px;
  opacity:0;transition:.3s;pointer-events:none;z-index:70}
.toast.show{opacity:1;transform:translateX(-50%)}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.shake{animation:shake .35s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .22s}
/* boss */
.boss{text-align:center;padding:6px 0 2px}
.bossface{font-size:3.875rem;line-height:1.1;display:inline-block}
.hpwrap{height:16px;background:#2a1520;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.hp{height:100%;background:linear-gradient(90deg,#ef6f6f,#f0a35a);transition:width .45s;width:100%}
.hearts{font-size:1.1875rem;letter-spacing:3px}
/* duel */
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:6px 0 2px}
.duel .who{font-size:1.875rem}.duel .sc{font-size:1.625rem;font-weight:700;color:var(--gold)}
.buzz{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.buzz i{display:block;height:100%;width:100%;background:var(--bad);transition:width .1s linear}
/* forge */
.hand{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 4px}
.pcard{width:3.45rem;height:4.7rem;border-radius:10px;background:linear-gradient(160deg,#27354f,#1b2740);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:1.6875rem;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--gold)}
.keys{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.keys button{min-width:2.6rem;padding:.55rem .7rem;font-size:1.0625rem}
/* trick cards */
.tcard{border-radius:14px;padding:15px 17px;border:1px solid var(--line);background:var(--panel);margin:10px 0}
.tcard.locked{opacity:.45}
.tcard h4{margin:0 0 4px;font-size:1rem;color:var(--gold)}
.tcard .eg{font-variant-numeric:tabular-nums;color:var(--accent);margin-top:6px}
footer{color:var(--dim);font-size:0.75rem;text-align:center;padding:28px 16px 50px}

/* ---------- touch / iPad ---------- */
button,.lvl,.opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
button{min-height:2.6rem}
body{padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
body.padon{padding-bottom:16rem}
.pad{position:fixed;left:0;right:0;bottom:0;z-index:55;display:none;
  grid-template-columns:repeat(3,1fr);gap:.4rem;
  padding:.5rem .5rem calc(.5rem + env(safe-area-inset-bottom));
  background:rgba(24,33,52,.97);border-top:1px solid var(--line);backdrop-filter:blur(10px)}
.pad.show{display:grid}
.pad button{font-size:1.5rem;padding:.6rem;min-height:3.1rem;font-variant-numeric:tabular-nums}
.pad button.go{grid-column:1 / -1;background:var(--accent);color:#06241c;font-weight:650;font-size:1.1rem}
@media (display-mode:standalone){header{padding-top:env(safe-area-inset-top)}}
@media print{header,button,.lvl,canvas{display:none!important} body{background:#fff;color:#000}
  .card{border-color:#ccc;background:#fff}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<header>
  <div class="hbar">
    <div class="logo">Math Olympiad Camp<small>DAY 4 · OCT 15, 2026</small></div>
    <span class="rank" id="sRank">Bronze</span>
    <div class="stats">
      <div class="stat">⭐ <b id="sStar">0</b></div>
      <div class="stat">XP <b id="sXp">0</b></div>
      <div class="stat">🔥 <b id="sCombo">0</b></div>
      <a href="index.html" class="mute" style="text-decoration:none;display:inline-block;line-height:1.6">🏠</a>
      <button class="mute" id="padbtn" onclick="togglePad()">⌨︎ Pad</button>
      <button class="mute" onclick="zoom(-2)" title="Smaller text">A−</button>
      <span class="zlab" id="zlab">100%</span>
      <button class="mute" onclick="zoom(2)" title="Bigger text">A+</button>
      <button class="mute" onclick="fitScreen()" title="Fit the text to this screen">⤢ Fit</button>
      <button class="mute" id="mute" onclick="toggleMute()">🔊</button>
    </div>
    <div class="xpwrap"><div class="xpbar" id="xpbar"></div></div>
  </div>
</header>
<div class="toast" id="toast"></div>
<div class="wrap" id="app"></div>
<footer>One hour a day · 10 min warm-up · 20 min learn · 25 min practice · 5 min summary · progress saves on this device</footer>

<script>
/* ===================== STATE ===================== */
const KEY='mathcamp_day4_v1';
const S=Object.assign({xp:0,stars:{},pass:{},best:0,wrong:[],seen:0,right:0,
  forge:0,duelW:0,bossWin:0,mute:false,fs:18},JSON.parse(localStorage.getItem(KEY)||'{}'));
let combo=0;
const RANKS=[[0,'Bronze'],[250,'Silver'],[600,'Gold'],[1100,'Platinum'],[1800,'Olympian']];
function rankOf(xp){let r='Bronze';RANKS.forEach(([t,n])=>{if(xp>=t)r=n});return r}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function hud(){
  sStar.textContent=Object.values(S.stars).reduce((a,b)=>a+b,0);
  sXp.textContent=S.xp; sCombo.textContent=combo; sRank.textContent=rankOf(S.xp);
  const i=RANKS.findIndex(r=>r[1]===rankOf(S.xp)), lo=RANKS[i][0], hi=i+1<RANKS.length?RANKS[i+1][0]:lo+600;
  xpbar.style.width=Math.min(100,(S.xp-lo)/(hi-lo)*100)+'%';
  mute.textContent=S.mute?'🔇':'🔊';
}
function toggleMute(){S.mute=!S.mute;save();hud()}
/* ---- text zoom: one root value scales every rem on the page ---- */
const FSMIN=14,FSMAX=34,FSDEF=18;
function applyFs(){
  S.fs=Math.min(FSMAX,Math.max(FSMIN,S.fs||FSDEF));
  document.documentElement.style.fontSize=S.fs+'px';
  const z=document.getElementById('zlab'); if(z)z.textContent=Math.round(S.fs/FSDEF*100)+'%';
}
function zoom(d){S.fs=(S.fs||FSDEF)+d;save();applyFs();}
function fitScreen(){ // make the content column fill the window width
  S.fs=Math.round(Math.min(FSMAX,Math.max(FSMIN,innerWidth/51)));
  save();applyFs();toastMsg('Text fitted to this screen');
}
addEventListener('resize',()=>{const z=document.getElementById('zlab');if(z)applyFs()});
function toastMsg(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');
  setTimeout(()=>e.classList.remove('show'),1500)}

/* ===================== JUICE: sound + confetti ===================== */
let AC=null;
function tone(f,dur=.12,type='sine',vol=.18,delay=0){
  if(S.mute)return; try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
  const t0=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+dur+.03);
}
const SFX={
  ok(c){const base=523.25*Math.pow(1.0595,Math.min(c,12)); tone(base,.1,'triangle',.16); tone(base*1.5,.14,'triangle',.12,.07)},
  no(){tone(150,.16,'square',.12); tone(110,.2,'square',.1,.08)},
  hit(){tone(220,.07,'sawtooth',.14); tone(140,.14,'square',.1,.05)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.16,i*.09))},
  lose(){[392,330,262].forEach((f,i)=>tone(f,.22,'sine',.14,i*.12))},
  buzz(){tone(880,.07,'square',.14); tone(660,.09,'square',.12,.06)}
};
const fx=document.getElementById('fx'), ctx=fx.getContext('2d');
let parts=[];
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight} sizeFx(); addEventListener('resize',sizeFx);
function burst(n=70,x=innerWidth/2,y=innerHeight/3){
  const cols=['#4cc3a5','#5aa9f0','#f5cc4d','#a98bdc','#f0a35a'];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*11,vy:Math.random()*-11-2,
    g:.35,l:70+Math.random()*40,a:1,c:cols[i%cols.length],s:3+Math.random()*4,r:Math.random()*6});
  if(parts.length===n) requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.l>0);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;p.a=Math.max(0,p.l/90);p.r+=.2;
    ctx.save();ctx.globalAlpha=p.a;ctx.translate(p.x,p.y);ctx.rotate(p.r);
    ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*1.6);ctx.restore()});
  if(parts.length)requestAnimationFrame(tick); else ctx.clearRect(0,0,fx.width,fx.height);
}
function shake(sel){const e=document.querySelector(sel);if(!e)return;
  e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}

/* ===================== GENERATORS =====================
   One source of truth per problem: the string `expr`.
   The answer is that string evaluated; the display is that string rewritten. */
const num=v=>parseFloat(String(v==null?'':v).replace(/[,\s]/g,''));
function val(e){ return Function('"use strict";return ('+e+')')(); }
function show(e){ return e.replace(/\*/g,' × ').replace(/\//g,' ÷ ')
  .replace(/\+/g,' + ').replace(/-/g,' − ').replace(/\s+/g,' ').trim(); }
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const GEN={};
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
const comma=n=>n.toLocaleString('en-US');
const NAMES=['Ana','Ben','Cal','Dev','Eli','Fay','Gus','Ivy','Jo','Kim','Leo','Mia','Noa','Sam','Tia','Zed'];
const two=()=>shuf(NAMES).slice(0,2);
const three=()=>shuf(NAMES).slice(0,3);
const READ='<span class="qsub">Before you solve: what is the question, and what unit is the answer?</span>';

GEN.warm=()=>{  /* mixed from the week — tomorrow is review */
  const t=pick(['order','x11','sq5','mirror','comp','pair','place','x25']);
  if(t==='order'){const b=ri(2,9),c=ri(2,6),m=ri(2,5),a=b*c*m,e=a+'/'+b+'*'+c;
    return{disp:show(e),ans:val(e),steps:['Left to right: '+a+' ÷ '+b+' = '+(c*m)+', × '+c+' = '+val(e)+'.']}}
  if(t==='x11'){const n=pick([12,23,34,45,27,36,54,63,72,81,19,28]);
    return{disp:n+' × 11',ans:11*n,steps:['Split, add, carry if needed: '+(11*n)+'.']}}
  if(t==='sq5'){const k=ri(1,9);return{disp:(k*10+5)+'²',ans:(k*10+5)**2,steps:[k+' × '+(k+1)+' then 25: '+((k*10+5)**2)+'.']}}
  if(t==='mirror'){const a=pick([20,30,40,50,60]),d=pick([1,2]);
    return{disp:(a-d)+' × '+(a+d),ans:a*a-d*d,steps:[a+'² − '+d+'² = '+(a*a-d*d)+'.']}}
  if(t==='comp'){const k=ri(3,9),n=pick([98,99,101,999]);return{disp:k+' × '+n,ans:k*n,steps:['Round number ± correction: '+comma(k*n)+'.']}}
  if(t==='pair'){const a=ri(21,79),c=100-a,b=ri(21,79),d=100-b,e=shuf([a,b,c,d]).join('+');
    return{disp:show(e),ans:200,steps:['Pairs to 100: 200.']}}
  if(t==='place'){const n=ri(1203,9876),k=pick([10,100]);
    return{disp:'How many whole '+(k===10?'tens':'hundreds')+' in '+comma(n)+'?',word:true,ans:Math.floor(n/k),
      steps:['Chop: '+Math.floor(n/k)+'.']}}
  const n=ri(3,40)*4;return{disp:'25 × '+n,ans:25*n,steps:['÷ 4 then × 100: '+comma(25*n)+'.']};
};

/* ---- Concept 1: underline the question (the answer is a DIFFERENT number from the obvious one) ---- */
GEN.question=()=>{
  const t=pick(['more','unit','total','left','notthat']);
  if(t==='more'){const [p,q]=two(),a=ri(14,48),b=ri(5,a-4);
    return{disp:p+' has '+a+' marbles and '+q+' has '+b+'. How many <span class="hl">more</span> marbles does '+p+' have than '+q+'?'+'<br>'+READ,
      word:true,ans:a-b,steps:['The question is "how many <b>more</b>" — a difference, not a total and not '+p+'\u2019s count.',
        a+' − '+b+' = '+(a-b)+'.'],trap:'Answers of '+a+' and '+(a+b)+' are both correct maths for questions that were not asked.'}}
  if(t==='unit'){const h=pick([1.5,2.5,3.5,0.75,1.25]),mins=h*60;
    return{disp:'A film lasts '+h+' hours. How many <span class="hl">minutes</span> is that?<br>'+READ,word:true,ans:mins,
      steps:['The word "minutes" is the whole problem.',h+' × 60 = '+mins+'.'],
      trap:'Writing '+h+' is a correct computation and a wrong answer. Say the unit out loud before you write.'}}
  if(t==='total'){const [p,q]=two(),a=ri(12,40),d=ri(3,15);
    return{disp:p+' has '+a+' cards. '+q+' has '+d+' more than '+p+'. How many cards do they have <span class="hl">together</span>?<br>'+READ,
      word:true,ans:2*a+d,steps:[q+' has '+a+' + '+d+' = '+(a+d)+'.','Together: '+a+' + '+(a+d)+' = '+(2*a+d)+'.'],
      trap:'Stopping at '+(a+d)+' answers "how many does '+q+' have" — not what was asked.'}}
  if(t==='left'){const [p]=two(),a=ri(30,90),s=ri(3,9),k=ri(2,6),spent=s*k;
    if(spent>=a) return GEN.question();
    return{disp:p+' had $'+a+' and bought '+k+' books at $'+s+' each. How much money is <span class="hl">left</span>?<br>'+READ,
      word:true,ans:a-spent,unit:' dollars',steps:['Spent: '+k+' × '+s+' = '+spent+'.','Left: '+a+' − '+spent+' = '+(a-spent)+'.'],
      trap:'The spent amount ('+spent+') is the trap answer — it is the number you computed last, not the number asked for.'}}
  const [p,q,r]=three(),B=ri(4,12),m=pick([2,3]),add=ri(2,6),who=pick(['A','C']);
  const A=m*B,C=B+add,total=A+B+C;
  return{disp:'Three friends share '+total+' stickers. '+p+' gets '+m+' times as many as '+q+', and '+r+' gets '+add+' more than '+q+
    '. How many does <span class="hl">'+(who==='A'?p:r)+'</span> get?<br>'+READ,word:true,ans:who==='A'?A:C,
    steps:['Everything is measured against '+q+', so '+q+' is the unknown: call it B.',
      p+' = '+m+'B, '+r+' = B + '+add+', and '+m+'B + B + B + '+add+' = '+total+' → '+(m+2)+'B = '+(total-add)+' → B = '+B+'.',

/* ---- Concept 2: name the unknown ---- */
GEN.unknown=()=>{
  const t=pick(['age','tickets','consec','twice']);
  if(t==='age'){const [p,q]=two(),L=ri(5,12),d=ri(2,6),y=ri(3,8),M=L+d,sum=(L+y)+(M+y),ask=pick(['M','L']);
    return{disp:p+' is '+d+' years older than '+q+'. In '+y+' years their ages will add up to '+sum+'. How old is <span class="hl">'+(ask==='M'?p:q)+'</span> now?<br>'+READ,
      word:true,ans:ask==='M'?M:L,steps:['Let '+q+' now = L, so '+p+' now = L + '+d+'.',
        'In '+y+' years: (L + '+y+') + (L + '+d+' + '+y+') = '+sum+' → 2L + '+(d+2*y)+' = '+sum+' → L = '+L+'.',
        (ask==='M'?p+' = '+L+' + '+d+' = '+M:q+' = '+L)+'.'],
      trap:'Two traps: the other person\u2019s age, and the age in '+y+' years ('+(ask==='M'?M+y:L+y)+'). The question said <b>now</b>.'}}
  if(t==='tickets'){const pa=pick([7,8,9,10]),pc=pick([4,5,6]),a=ri(2,6),c=ri(2,8),n=a+c,tot=pa*a+pc*c,ask=pick(['c','a']);
    return{disp:'Adult tickets cost $'+pa+' and child tickets cost $'+pc+'. A group buys '+n+' tickets for $'+tot+'. How many <span class="hl">'+(ask==='c'?'child':'adult')+'</span> tickets?<br>'+READ,
      word:true,ans:ask==='c'?c:a,steps:['If all '+n+' were children: '+n+' × '+pc+' = $'+(n*pc)+', which is $'+(tot-n*pc)+' short.',
        'Each swap child→adult adds $'+(pa-pc)+'. '+(tot-n*pc)+' ÷ '+(pa-pc)+' = '+a+' adults, so '+c+' children.',
        'Check: '+a+' × '+pa+' + '+c+' × '+pc+' = '+tot+' ✓'],
      trap:'Organised guess-and-check is a real method, not cheating — when it is organised.'}}
  if(t==='consec'){const n=ri(5,30),k=pick([2,3]),sum=k===2?2*n+1:3*n+3,ask=pick(['small','large']);
    return{disp:'The sum of '+k+' consecutive whole numbers is '+sum+'. What is the <span class="hl">'+(ask==='small'?'smallest':'largest')+'</span> of them?<br>'+READ,
      word:true,ans:ask==='small'?n:n+k-1,steps:['Name the smallest n. The others are '+(k===2?'n + 1':'n + 1 and n + 2')+'.',
        (k===2?'2n + 1':'3n + 3')+' = '+sum+' → n = '+n+'.','The question asked for the '+(ask==='small'?'smallest: '+n:'largest: '+(n+k-1))+'.']}}
  const [p,q]=two(),B=ri(5,20),m=pick([2,3,4]),tot=B+m*B;
  return{disp:p+' has '+m+' times as many stamps as '+q+'. Together they have '+tot+'. How many does <span class="hl">'+p+'</span> have?<br>'+READ,
    word:true,ans:m*B,steps:[p+' is described in terms of '+q+', so '+q+' is the unknown: B.',
      'B + '+m+'B = '+tot+' → '+(m+1)+'B = '+tot+' → B = '+B+'.',p+' = '+m+' × '+B+' = '+(m*B)+'.'],

GEN.plan=()=>{
  const t=pick(['posts','cuts','backwards','backwards','vans']);
  if(t==='posts'){const gap=pick([4,5,6,8,10]),n=ri(4,12),L=gap*n;
    return{disp:'A straight path is '+L+' m long. Lamps stand every '+gap+' m, including one at each end. How many lamps?<br>'+READ,
      word:true,ans:n+1,steps:['Draw it: lamps at 0, '+gap+', '+(2*gap)+', … , '+L+'.',L+' ÷ '+gap+' = '+n+' counts the <b>gaps</b>. Lamps = gaps + 1 = '+(n+1)+'.'],
      trap:'Gaps and posts are different things. A picture never confuses them; arithmetic alone often does.'}}
  if(t==='cuts'){const c=ri(3,9);
    return{disp:'A log is cut into pieces with '+c+' straight cuts. How many pieces?<br>'+READ,word:true,ans:c+1,

/* ---- Spot the First Mistake: today the mistakes are READING mistakes ---- */
GEN.trap=()=>{
  const kind=pick(['who','when','unit','gaps']);
  let prob,L=[],bad,why;
  if(kind==='who'){const [p,q,r]=three(),B=ri(4,12),m=pick([2,3]),add=ri(2,6),A=m*B,C=B+add,total=A+B+C;
    prob=p+' gets '+m+'× '+q+'; '+r+' gets '+add+' more than '+q+'; total '+total+'. How many does '+p+' get?';
    bad=3;L=['Let '+q+' = B. Then '+p+' = '+m+'B and '+r+' = B + '+add,(m+2)+'B + '+add+' = '+total+', so B = '+B,'Answer: '+B];
    why='Steps 1 and 2 are perfect. Step 3 answered "how many does '+q+' get". The question asked for '+p+': '+m+' × '+B+' = '+A+'.';}
  else if(kind==='when'){const [p,q]=two(),Lg=ri(5,12),d=ri(2,6),y=ri(3,8),M=Lg+d,sum=(Lg+y)+(M+y);
    prob=p+' is '+d+' older than '+q+'. In '+y+' years their ages sum to '+sum+'. How old is '+p+' now?';
    bad=3;L=['Let '+q+' now = L, '+p+' now = L + '+d,'(L + '+y+') + (L + '+d+' + '+y+') = '+sum+', so L = '+Lg,'Answer: '+p+' = '+Lg+' + '+d+' + '+y+' = '+(M+y)];
    why='The maths is right up to L = '+Lg+'. Step 3 added the '+y+' years — but the question said <b>now</b>. '+p+' = '+Lg+' + '+d+' = '+M+'.';}
  else if(kind==='unit'){const h=pick([1.5,2.5,3.5]),mins=h*60;
    prob='A film lasts '+h+' hours. How many minutes is that?';
    const mode=pick(['unit','slip']);
    if(mode==='unit'){bad=1;L=['The film is '+h+' long','So the answer is '+h,'Done'];why='Step 1 never converted. The question asked for <b>minutes</b>: '+h+' × 60 = '+mins+'.';}
    else{bad=2;L=['1 hour = 60 minutes',h+' × 60 = '+(mins+10),'Answer: '+(mins+10)+' minutes'];why=h+' × 60 = '+mins+', not '+(mins+10)+'. Right method, arithmetic slip.';}
  }
  else{const gap=pick([4,5,8,10]),n=ri(4,12),Lm=gap*n;
    prob='A '+Lm+' m path has a lamp every '+gap+' m including both ends. How many lamps?';
    bad=2;L=['Lamps are '+gap+' m apart along '+Lm+' m',Lm+' ÷ '+gap+' = '+n+' lamps','Answer: '+n];
    why=Lm+' ÷ '+gap+' counts the gaps between lamps, not the lamps. Draw it: '+(n+1)+' lamps.';}
  return{disp:'A student worked on: <span class="mono">'+prob+'</span><br>Which step is the <span class="hl">first</span> mistake?',
    word:true,lines:L,ans:bad,choices:[1,2,3],
    steps:['Step '+bad+' is where it first goes wrong.',why,
      'Notice: most of today\u2019s mistakes are not arithmetic. They are reading. Those go in the error book as reading errors.']};
};

/* ===================== 24 FORGE ===================== */
const EPS=1e-6;
function solve24(nums,target){
  function rec(list){
    if(list.length===1) return Math.abs(list[0].v-target)<EPS?list[0].s:null;
    for(let i=0;i<list.length;i++)for(let j=0;j<list.length;j++){
      if(i===j)continue;
      const a=list[i],b=list[j],rest=list.filter((_,k)=>k!==i&&k!==j);
      const c=[{v:a.v+b.v,s:'('+a.s+' + '+b.s+')'},{v:a.v*b.v,s:'('+a.s+' × '+b.s+')'},
               {v:a.v-b.v,s:'('+a.s+' − '+b.s+')'}];
      if(Math.abs(b.v)>EPS)c.push({v:a.v/b.v,s:'('+a.s+' ÷ '+b.s+')'});
      for(const x of c){const r=rec(rest.concat([x]));if(r)return r}
    }
    return null;
  }
  return rec(nums.map(n=>({v:n,s:''+n})));
}
function deal24(target){
  for(let t=0;t<400;t++){
    const h=[0,0,0,0].map(()=>ri(1,10));
    const sol=solve24(h,target);
    if(sol) return {hand:h,sol};
  }
  return {hand:[4,6,2,3],sol:solve24([4,6,2,3],target)};
}
function checkExpr(str,hand,target){
  if(!str.trim()) return {ok:false,msg:'Build something first.'};
  if(!/^[0-9+\-*/×÷−(). ]+$/.test(str)) return {ok:false,msg:'Only numbers, + − × ÷ and parentheses.'};
  const js=str.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  const used=(js.match(/\d+/g)||[]).map(Number).sort((a,b)=>a-b);
  const want=hand.slice().sort((a,b)=>a-b);
  if(used.length!==want.length||used.some((v,i)=>v!==want[i]))
    return {ok:false,msg:'Use each of the four cards exactly once — and no sticking digits together.'};
  let v; try{v=Function('"use strict";return ('+js+')')()}catch(e){return{ok:false,msg:'That is not a finished expression — check the brackets.'}}
  if(typeof v!=='number'||!isFinite(v)) return {ok:false,msg:'Check the brackets.'};
  return Math.abs(v-target)<EPS?{ok:true,v}:{ok:false,msg:'That comes out to '+(Math.round(v*1000)/1000)+', not '+target+'.'};
}

/* ===================== QUIZ ENGINE ===================== */
let Q=null,P={},tStart=0;
function viewPlay(id){
  const i=LIDX[id]; if(i===undefined||!unlocked(i))return go('');
  const L=LEVELS[i];
  if(L.forge)return forgeStart();
  if(L.duel)return duelStart();
  P={id,i:0,right:0,n:L.need,pool:L.boss?BOSS.slice():null,starred:[],hp:100,lives:3};
  app.innerHTML=`<div class="row"><button class="ghost" onclick="go('')">← Back to map</button>
   ${L.concept?`<button class="ghost" onclick="go('concept','${L.concept}')">📖 Read the concept</button>`:''}</div>
  <h1>${L.ico} ${L.nm}</h1><p class="sub">${L.en} · about ${L.mins} min</p>
  <div class="card quiet">${L.intro}</div><div class="card" id="qcard"></div>`;
  nextQ();
}
function bossFace(hp){return hp>70?'👑':hp>40?'😠':hp>15?'🥵':'💢'}
function nextQ(){
  const L=LEVELS[LIDX[P.id]];
  if(L.boss){ if(P.hp<=0)return finish(true); if(P.lives<=0)return finish(false); }
  else if(P.i>=P.n) return finish();
  Q = L.boss ? (P.pool[P.i]||GEN[pick(['question','unknown','plan'])]()) : GEN[L.gen]();
  tStart=Date.now();
  document.getElementById('qcard').innerHTML=`
   ${L.boss?`<div class="boss"><div class="bossface pop">${bossFace(P.hp)}</div>
     <div class="hpwrap"><div class="hp" style="width:${P.hp}%"></div></div>
     <div class="qsub">Boss HP ${Math.max(0,P.hp)} / 100 · <span class="hearts">${'❤️'.repeat(P.lives)}${'🖤'.repeat(3-P.lives)}</span></div></div>`
    :`<div class="pbar"><i style="width:${P.i/P.n*100}%"></i></div>
      <div class="qsub">Problem ${P.i+1} of ${P.n} ${combo>1?`· <span class="combo">🔥 streak ${combo}</span>`:''}</div>`}
   <div class="q ${Q.word?'word':''}">${Q.disp}</div>
   ${Q.lines?`<ol class="mono" style="margin:10px 0 0 20px;font-size:1.0625rem">${Q.lines.map(l=>`<li style="margin:5px 0">${l}</li>`).join('')}</ol>
     <p class="qsub" style="margin-top:10px">Which step is the first mistake?</p>`:''}
   ${Q.unit?`<div class="qsub">Answer in${Q.unit}.</div>`:''}
   ${Q.choices?`<div class="opts">${Q.choices.map(o=>`<button class="opt" onclick="answer(${o})">${Q.lines?'Step '+o:o}</button>`).join('')}</div>`
    :`<div class="row"><input type="text" ${RO()} id="ans" inputmode="decimal" autocomplete="off" placeholder="answer">
      <button class="primary" onclick="answer()">Submit</button>
      <button class="ghost" onclick="skip()">Stuck — star it and move on</button></div>`}
   <div class="fb" id="fb"></div>`;
  const el=document.getElementById('ans'); if(el){el.focus();el.onkeydown=e=>{if(e.key==='Enter')answer()}}
}
function fbHTML(ok,q){
  return `<b>${ok?'✅ Correct':'❌ Look again'}</b>${ok?'':' — the answer is <span class="hl">'+
   (q.lines?'step '+q.ans:q.ans+(q.unit||''))+'</span>'}
   <ol>${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
   ${q.trap?`<p style="margin-top:10px;color:var(--warn)">⚠️ ${q.trap}</p>`:''}`;
}
function answer(choice){
  const el=document.getElementById('ans');
  const v = choice!==undefined?choice:num(el.value);
  if(isNaN(v))return;
  const L=LEVELS[LIDX[P.id]], ok=Math.abs(v-Q.ans)<1e-9, secs=(Date.now()-tStart)/1000;
  S.seen++;
  let dmg=0;
  if(ok){S.right++;combo++;S.best=Math.max(S.best,combo);S.xp+=10+Math.min(combo,10)*2;P.right++;
    SFX.ok(combo);
    if(L.boss){dmg=Math.round(10+Math.max(0,15-secs/2));P.hp-=dmg;SFX.hit();burst(26,innerWidth/2,230);}
  }else{combo=0;SFX.no();shake('#qcard');
    if(L.boss)P.lives--;
    S.wrong.push({lvl:P.id,disp:Q.disp,ans:Q.lines?'step '+Q.ans:Q.ans,steps:Q.steps,trap:Q.trap||'',lines:Q.lines||null});}
  save();hud();
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=(L.boss&&ok?`<b>💥 ${dmg} damage</b> — ${secs<6?'that was fast':'solid'}. Boss at ${Math.max(0,P.hp)} HP.<br>`:'')
    +(L.boss&&!ok?`<b>💔 The boss lands a hit.</b> ${P.lives} heart${P.lives===1?'':'s'} left.<br>`:'')
    +fbHTML(ok,Q)+`<div class="row"><button class="primary" onclick="P.i++;nextQ()">${
      L.boss&&P.hp<=0?'Finish it →':L.boss&&P.lives<=0?'See the result →':'Next →'}</button></div>`;
  document.querySelectorAll('#qcard button').forEach(b=>{if(b.onclick&&!b.onclick.toString().includes('nextQ'))b.disabled=true});
  fb.querySelectorAll('button').forEach(b=>b.disabled=false);
  if(ok&&combo>=5&&combo%5===0)toastMsg('🔥 '+combo+' in a row!');
}
function skip(){
  combo=0;P.starred.push(Q.disp);
  S.wrong.push({lvl:P.id,disp:Q.disp,ans:Q.ans,steps:Q.steps,trap:Q.trap||'',starred:true,lines:Q.lines||null});
  save();hud();
  const fb=document.getElementById('fb');fb.className='fb no';
  fb.innerHTML=`<b>⭐ Starred.</b> Following the plan, <b>do not read the solution yet</b> — give it one honest attempt
   tomorrow first. It is saved in your error book.
   <div class="row"><button class="primary" onclick="P.i++;nextQ()">Next →</button>
   <button class="ghost" onclick="peek()">I already tried — show me now</button></div>`;
}
function peek(){document.getElementById('fb').innerHTML=fbHTML(false,Q)+
  `<div class="row"><button class="primary" onclick="P.i++;nextQ()">Next →</button></div>`}
function finish(bossWon){
  const L=LEVELS[LIDX[P.id]];
  let st;
  if(L.boss){ st = bossWon ? (P.lives===3?3:P.lives===2?2:1) : 0; if(bossWon){S.bossWin++} }
  else { const r=P.right/P.n; st = r>=1?3:r>=.8?2:r>=.6?1:0; }
  if(st>0){S.pass[P.id]=true;SFX.win();burst(110)} else SFX.lose();
  S.stars[P.id]=Math.max(S.stars[P.id]||0,st);save();hud();
  const nxt=LIDX[P.id]+1;
  document.getElementById('qcard').innerHTML=`
   <h2 style="margin-top:0">${L.boss?(bossWon?'👑 Boss defeated':'💀 The boss wins this time'):
     st===3?'💎 Perfect clear':st>0?'🎉 Level cleared':'Run it again'}</h2>
   <div style="font-size:1.875rem;letter-spacing:6px;color:var(--gold)">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
   <p>${L.boss?(bossWon?`You finished with ${P.lives} heart${P.lives===1?'':'s'}. Three hearts means a perfect clear.`
      :'The boss does not get stronger — you do. Read the error book and come back.')
      :`<b>${P.right}</b> of ${P.n} correct${P.starred.length?`, ${P.starred.length} starred`:''}.`}
   ${st===0&&!L.boss?' Under 60% — read the concept again, then retry.':''}</p>
   <div class="row"><button onclick="viewPlay('${P.id}')">Retry</button>
     ${st>0&&nxt<LEVELS.length?`<button class="primary" onclick="go('play','${LEVELS[nxt].id}')">Next: ${LEVELS[nxt].nm} →</button>`:''}
     ${nxt>=LEVELS.length?`<button class="primary" onclick="go('summary')">Write today's summary →</button>`:''}
     <button class="ghost" onclick="go('')">Back to map</button></div>`;
}

/* ===================== NUMBER FORGE ===================== */
let F={};
function forgeStart(){
  F={solved:0,need:3,target:24,hand:[],sol:'',hints:0};
  app.innerHTML=`<div class="row"><button class="ghost" onclick="go('')">← Back to map</button></div>
   <h1>🎴 Number Forge</h1><p class="sub">Make the target · ${LEVELS[LIDX.forge].mins} min</p>
   <div class="card quiet">${LEVELS[LIDX.forge].intro}</div><div class="card" id="qcard"></div>`;
  forgeDeal();
}
function forgeDeal(){
  F.target = F.solved>=2 ? pick([24,36,48]) : 24;
  const d=deal24(F.target); F.hand=d.hand; F.sol=d.sol; F.hints=0;
  document.getElementById('qcard').innerHTML=`
   <div class="pbar"><i style="width:${F.solved/F.need*100}%"></i></div>
   <div class="qsub">Hand ${F.solved+1} of ${F.need} · every hand dealt here is solvable — the page checked before dealing it</div>
   <h2 style="margin:10px 0 0">Target: <span class="hl">${F.target}</span></h2>
   <div class="hand">${F.hand.map(n=>`<div class="pcard">${n}</div>`).join('')}</div>
   <div class="row"><input type="text" ${RO()} id="expr" placeholder="e.g.  (6 - 4) * 3 * 4" autocomplete="off"></div>
   <div class="keys">
     ${F.hand.map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}
     <button onclick="key('+')">+</button><button onclick="key('-')">−</button>
     <button onclick="key('*')">×</button><button onclick="key('/')">÷</button>
     <button onclick="key('(')">(</button><button onclick="key(')')">)</button>
     <button class="ghost" onclick="back()">⌫</button><button class="ghost" onclick="clr()">clear</button>
   </div>
   <div class="row"><button class="primary" onclick="forgeCheck()">Check it</button>
     <button class="ghost" onclick="forgeHint()">Hint</button>
     <button class="ghost" onclick="forgeGiveUp()">Show a solution</button></div>
   <div class="fb" id="fb"></div>`;
  const el=document.getElementById('expr'); el.focus(); el.onkeydown=e=>{if(e.key==='Enter')forgeCheck()};
}
function key(c){const e=document.getElementById('expr');e.value+=c;e.focus()}
function back(){const e=document.getElementById('expr');e.value=e.value.slice(0,-1);e.focus()}
function clr(){const e=document.getElementById('expr');e.value='';e.focus()}
function forgeCheck(){
  const r=checkExpr(document.getElementById('expr').value,F.hand,F.target);
  const fb=document.getElementById('fb');
  if(r.ok){
    F.solved++;S.forge++;S.seen++;S.right++;combo++;S.best=Math.max(S.best,combo);
    S.xp+=Math.max(10,40-F.hints*12);save();hud();SFX.win();burst(90);
    fb.className='fb ok';
    fb.innerHTML=`<b>✅ That works.</b> ${F.hints?'(with a hint)':'No hints — the hard way.'}
      <p>Yours is one of several. The page also found: <span class="mono">${F.sol}</span></p>
      <div class="row"><button class="primary" onclick="${F.solved>=F.need?'forgeEnd()':'forgeDeal()'}">${
        F.solved>=F.need?'Finish the level →':'Next hand →'}</button></div>`;
  }else{
    SFX.no();shake('#qcard');fb.className='fb no';
    fb.innerHTML=`<b>Not yet.</b> ${r.msg}
     <p class="sub">Remember: brackets change which operation goes first. That is usually where the answer is hiding.</p>`;
  }
}
function forgeHint(){
  F.hints++; const fb=document.getElementById('fb'); fb.className='fb no';
  const first=F.sol.replace(/^\(/,'').split(' ').slice(0,3).join(' ');
  fb.innerHTML=`<b>Hint ${F.hints}.</b> ${F.hints===1
    ? 'Look for two cards that make a useful number first — often '+(F.target/2)+', '+(F.target/3)+' or '+(F.target/4)+'.'
    : 'One solution starts by combining <span class="mono hl">'+first+'</span>.'}
   <p class="sub">Hints cost XP, not pride.</p>`;
}
function forgeGiveUp(){
  const fb=document.getElementById('fb'); fb.className='fb no'; SFX.lose();
  fb.innerHTML=`<b>One solution:</b> <span class="mono hl">${F.sol} = ${F.target}</span>
   <p>Cover it up and rebuild it yourself before moving on — that is what turns a shown answer into a learned one.</p>
   <div class="row"><button class="primary" onclick="forgeDeal()">New hand →</button></div>`;
}
function forgeEnd(){
  const st=F.hints===0?3:F.hints<=2?2:1;
  S.pass.forge=true;S.stars.forge=Math.max(S.stars.forge||0,st);save();hud();SFX.win();burst(120);
  document.getElementById('qcard').innerHTML=`<h2 style="margin-top:0">🎴 Forge cleared</h2>
   <div style="font-size:1.875rem;letter-spacing:6px;color:var(--gold)">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
   <p>Three hands built. Every one of them was a parentheses puzzle in disguise.</p>
   <div class="row"><button onclick="forgeStart()">Play again</button>
   <button class="primary" onclick="go('play','duel')">Next: Countdown Duel →</button>
   <button class="ghost" onclick="go('')">Back to map</button></div>`;
}

/* ===================== COUNTDOWN DUEL ===================== */
const RIVALS=[{n:'Tortoise',e:'🐢',lo:11,hi:19},{n:'Fox',e:'🦊',lo:7,hi:13},{n:'Circuit',e:'🤖',lo:4.5,hi:8}];
const TAUNT=['Too slow!','Got there first.','Buzz.','That one was easy.','My turn again.'];
let D={};
function duelStart(){
  app.innerHTML=`<div class="row"><button class="ghost" onclick="go('')">← Back to map</button></div>
   <h1>⚔️ Countdown Duel</h1><p class="sub">First to 5 · pick your rival</p>
   <div class="card quiet">${LEVELS[LIDX.duel].intro}</div>
   <div class="card"><h3>Who are you racing?</h3><div class="row">
     ${RIVALS.map((r,i)=>`<button onclick="duelGo(${i})">${r.e} ${r.n} <span class="sub">· buzzes in ${r.lo}–${r.hi}s</span></button>`).join('')}
   </div></div>`;
}
function duelGo(i){
  D={r:RIVALS[i],me:0,them:0,over:false};
  app.innerHTML=`<div class="row"><button class="ghost" onclick="go('')">← Quit duel</button></div>
   <h1>⚔️ You vs ${D.r.e} ${D.r.n}</h1><div class="card" id="qcard"></div>`;
  duelQ();
}
function duelQ(){
  if(D.me>=5||D.them>=5)return duelEnd();
  Q=GEN[pick(['warm','warm','warm'])]();
  const ms=(D.r.lo+Math.random()*(D.r.hi-D.r.lo))*1000, t0=Date.now();
  document.getElementById('qcard').innerHTML=`
   <div class="duel"><div><div class="who">🙂</div><div class="sc" id="me">${D.me}</div><div class="qsub">you</div></div>
     <div class="qsub">first to 5</div>
     <div><div class="who">${D.r.e}</div><div class="sc" id="them">${D.them}</div><div class="qsub">${D.r.n}</div></div></div>
   <div class="buzz"><i id="bz"></i></div>
   <div class="q">${Q.disp}</div>
   <div class="row"><input type="text" ${RO()} id="ans" inputmode="decimal" autocomplete="off" placeholder="buzz in">
     <button class="primary" onclick="duelAns()">Buzz!</button></div>
   <div class="fb" id="fb"></div>`;
  const el=document.getElementById('ans');el.focus();el.onkeydown=e=>{if(e.key==='Enter')duelAns()};
  if(duelTimer)clearInterval(duelTimer);
  duelTimer=setInterval(()=>{
    const left=1-(Date.now()-t0)/ms, b=document.getElementById('bz');
    if(!b){clearInterval(duelTimer);return}
    b.style.width=Math.max(0,left*100)+'%';
    if(left<=0){clearInterval(duelTimer);duelTimer=null;rivalBuzz()}
  },80);
}
function rivalBuzz(){
  D.them++;combo=0;SFX.buzz();shake('#qcard');
  S.wrong.push({lvl:'duel',disp:Q.disp,ans:Q.ans,steps:Q.steps,trap:Q.trap||''});save();hud();
  const fb=document.getElementById('fb');fb.className='fb no';
  document.getElementById('them').textContent=D.them;
  fb.innerHTML=`<b>${D.r.e} buzzes first.</b> “${pick(TAUNT)}” — the answer was <span class="hl">${Q.ans}</span>.
   <ol>${Q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
   <div class="row"><button class="primary" onclick="duelQ()">Next question →</button></div>`;
}
function duelAns(){
  const v=num(document.getElementById('ans').value); if(isNaN(v))return;
  if(duelTimer){clearInterval(duelTimer);duelTimer=null}
  const ok=Math.abs(v-Q.ans)<1e-9; S.seen++;
  const fb=document.getElementById('fb');
  if(ok){D.me++;S.right++;combo++;S.best=Math.max(S.best,combo);S.xp+=14;SFX.ok(combo);burst(22,innerWidth/2,210);
    document.getElementById('me').textContent=D.me;
    fb.className='fb ok';
    fb.innerHTML=`<b>✅ You beat the buzzer.</b> ${D.me}–${D.them}.
     <div class="row"><button class="primary" onclick="duelQ()">Next question →</button></div>`;
  }else{D.them++;combo=0;SFX.no();shake('#qcard');
    S.wrong.push({lvl:'duel',disp:Q.disp,ans:Q.ans,steps:Q.steps,trap:Q.trap||''});
    document.getElementById('them').textContent=D.them;
    fb.className='fb no';
    fb.innerHTML=`<b>❌ Wrong buzz — the point goes to ${D.r.n}.</b> The answer was <span class="hl">${Q.ans}</span>.
     <ol>${Q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
     <p class="sub">Under a buzzer, read twice and compute once. Most speed-round errors are reading errors.</p>
     <div class="row"><button class="primary" onclick="duelQ()">Next question →</button></div>`;}
  save();hud();
}
function duelEnd(){
  const won=D.me>=5;
  if(won){S.duelW++;S.pass.duel=true;S.stars.duel=Math.max(S.stars.duel||0,D.them<=1?3:D.them<=3?2:1);
    SFX.win();burst(130)}else SFX.lose();
  save();hud();
  document.getElementById('qcard').innerHTML=`<h2 style="margin-top:0">${won?'🏆 You win the duel':'😤 '+D.r.n+' takes it'}</h2>
   <div class="q">${D.me} – ${D.them}</div>
   <p>${won?'Speed is a separate skill from maths, and you just practised it.'
     :'Rematch, or drop to a slower rival. Losing a buzzer race is not the same as not knowing the maths.'}</p>
   <div class="row"><button onclick="duelStart()">Choose a rival again</button>
   ${won?`<button class="primary" onclick="go('play','boss')">Next: Boss Battle →</button>`:''}
   <button class="ghost" onclick="go('')">Back to map</button></div>`;
}

/* ===================== ENDLESS PRACTICE (with wager) ===================== */
let GQ=null,GN={n:0,r:0},wager=false;
function viewGym(key){
  key=key||'question';
  app.innerHTML=`<div class="row"><button class="ghost" onclick="go('')">← Back to map</button></div>
  <h1>♾️ Endless practice</h1><p class="sub">As many as you want. No stars here — just the streak.</p>
  <div class="row">${[['warm','Warm-up'],['question','Underline it'],['unknown','Name the unknown'],
    ['plan','Draw / backwards'],['trap','Spot the Mistake']]
    .map(k=>`<button class="${k[0]===key?'primary':''}" onclick="GN={n:0,r:0};go('gym','${k[0]}')">${k[1]}</button>`).join('')}</div>
  <div class="card" id="gcard"></div>`;
  gymQ(key);
}
function gymQ(key){
  GQ=GEN[key]();wager=false;
  document.getElementById('gcard').innerHTML=`
   <div class="qsub">${GN.r} of ${GN.n} this round ${combo>1?`· <span class="combo">🔥 ${combo}</span>`:''}</div>
   <div class="q ${GQ.word?'word':''}">${GQ.disp}</div>
   ${GQ.lines?`<ol class="mono" style="margin:10px 0 0 20px;font-size:1.0625rem">${GQ.lines.map(l=>`<li style="margin:5px 0">${l}</li>`).join('')}</ol>`:''}
   <div class="row"><input type="text" ${RO()} id="gans" inputmode="decimal" autocomplete="off" placeholder="${GQ.lines?'step number':'answer'}">
     <button class="primary" onclick="gymAns('${key}')">Submit</button>
     <button class="ghost" id="wg" onclick="setWager()">🎲 Double or nothing</button>
     <button class="ghost" onclick="gymQ('${key}')">Different problem</button></div>
   <div class="fb" id="gfb"></div>`;
  const el=document.getElementById('gans');el.focus();el.onkeydown=e=>{if(e.key==='Enter')gymAns(key)};
}
function setWager(){wager=!wager;const b=document.getElementById('wg');
  b.className=wager?'primary':'ghost';b.textContent=wager?'🎲 Wagered!':'🎲 Double or nothing';
  if(wager)tone(660,.09,'triangle',.14)}
function gymAns(key){
  const v=num(document.getElementById('gans').value);if(isNaN(v))return;
  const ok=Math.abs(v-GQ.ans)<1e-9;GN.n++;S.seen++;
  const base=6,pts=wager?base*2:base;
  if(ok){GN.r++;S.right++;combo++;S.best=Math.max(S.best,combo);S.xp+=pts;SFX.ok(combo);if(wager)burst(30)}
  else{combo=0;S.xp=Math.max(0,S.xp-(wager?base*2:0));SFX.no();shake('#gcard');
    S.wrong.push({lvl:key,disp:GQ.disp,ans:GQ.lines?'step '+GQ.ans:GQ.ans,steps:GQ.steps,trap:GQ.trap||'',lines:GQ.lines||null})}
  save();hud();
  const fb=document.getElementById('gfb');fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=(wager?`<b>🎲 ${ok?'+'+pts+' XP':'−'+pts+' XP'}</b><br>`:'')+fbHTML(ok,GQ)+
    `<div class="row"><button class="primary" onclick="gymQ('${key}')">Another →</button></div>`;
}

/* ===================== ERROR BOOK + REMATCH ===================== */
function viewWrong(){
  const nm=Object.fromEntries(LEVELS.map(l=>[l.id,l.nm]));
  app.innerHTML=`<div class="row"><button class="ghost" onclick="go('')">← Back to map</button>
   ${S.wrong.length?`<button class="primary" onclick="rematch()">⚔️ Rematch all (${S.wrong.length})</button>`:''}</div>
  <h1>📕 Error book</h1>
  <p class="sub">Not a punishment — a map. It tells you what to practise tomorrow.</p>
  ${S.wrong.length===0?'<div class="card quiet">Nothing here yet. Play a level and come back.</div>':
   S.wrong.map(w=>`<div class="card"><span class="badge">${nm[w.lvl]||w.lvl}</span>
    ${w.starred?'<span class="badge got">⭐ starred</span>':''}
    <div class="q word">${w.disp}</div>
    ${w.lines?`<ol class="mono" style="margin:6px 0 0 20px">${w.lines.map(l=>`<li>${l}</li>`).join('')}</ol>`:''}
    <p>Correct answer: <span class="hl">${w.ans}</span></p>
    <details><summary style="cursor:pointer;color:var(--accent2)">Show the solution</summary>
      <ol>${w.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
      ${w.trap?`<p style="color:var(--warn)">⚠️ ${w.trap}</p>`:''}</details></div>`).join('')}
  ${S.wrong.length?`<div class="row"><button onclick="S.wrong=[];save();render()">Clear the error book</button>
   <button class="primary" onclick="go('summary')">Write today's summary →</button></div>`:''}`;
}
let R={};
function rematch(){
  R={pool:S.wrong.slice(),i:0,right:0};
  app.innerHTML=`<div class="row"><button class="ghost" onclick="go('wrong')">← Back to the error book</button></div>
   <h1>⚔️ Rematch</h1><p class="sub">Every problem that beat you today, one more time.</p>
   <div class="card" id="rcard"></div>`;
  rQ();
}
function rQ(){
  if(R.i>=R.pool.length){
    document.getElementById('rcard').innerHTML=`<h2 style="margin-top:0">${R.right===R.pool.length?'🏆 Clean sweep':'Rematch done'}</h2>
     <p>You got <b>${R.right}</b> of ${R.pool.length} this time.
     ${R.right===R.pool.length?'Every problem that beat you today has now lost. That is what the error book is for.':
      'The ones still standing are tomorrow\u2019s warm-up.'}</p>
     <div class="row"><button class="primary" onclick="go('summary')">Write today's summary →</button>
     <button class="ghost" onclick="go('')">Back to map</button></div>`;
    if(R.right===R.pool.length){SFX.win();burst(130)}
    return;
  }
  const w=R.pool[R.i];
  document.getElementById('rcard').innerHTML=`
   <div class="pbar"><i style="width:${R.i/R.pool.length*100}%"></i></div>
   <div class="qsub">Rematch ${R.i+1} of ${R.pool.length}</div>
   <div class="q word">${w.disp}</div>
   ${w.lines?`<ol class="mono" style="margin:8px 0 0 20px">${w.lines.map(l=>`<li>${l}</li>`).join('')}</ol>`:''}
   <div class="row"><input type="text" ${RO()} id="rans" autocomplete="off" placeholder="answer">
     <button class="primary" onclick="rAns()">Submit</button></div>
   <div class="fb" id="rfb"></div>`;
  const el=document.getElementById('rans');el.focus();el.onkeydown=e=>{if(e.key==='Enter')rAns()};
}
function rAns(){
  const w=R.pool[R.i], raw=(document.getElementById('rans').value||'').trim().toLowerCase().replace(/^step\s*/,'');
  const want=String(w.ans).toLowerCase().replace(/^step\s*/,'');
  const ok = raw===want || (!isNaN(num(raw))&&!isNaN(num(want))&&Math.abs(num(raw)-num(want))<1e-9);
  const fb=document.getElementById('rfb');
  if(ok){R.right++;S.xp+=16;combo++;SFX.ok(combo);burst(24,innerWidth/2,220)}else{combo=0;SFX.no();shake('#rcard')}
  save();hud();
  fb.className='fb '+(ok?'ok':'no');
  fb.innerHTML=`<b>${ok?'✅ Beaten. Revenge taken.':'❌ Still standing — answer: '+w.ans}</b>
   <ol>${w.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
   <div class="row"><button class="primary" onclick="R.i++;rQ()">Next →</button></div>`;
}

/* ===================== SUMMARY ===================== */
function viewSummary(){
  const byLvl={};S.wrong.forEach(w=>byLvl[w.lvl]=(byLvl[w.lvl]||0)+1);
  const nm=Object.fromEntries(LEVELS.map(l=>[l.id,l.nm]));
  const weak=Object.entries(byLvl).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>nm[e[0]]||e[0]);
  app.innerHTML=`<div class="row"><button class="ghost" onclick="go('')">← Back to map</button>
   <button onclick="window.print()">🖨️ Print this page</button></div>
  <h1>✍️ Today's summary · 5 minutes</h1>
  <p class="sub">The part everyone skips, and the part that works. Write it <b>by hand</b>.</p>
  <div class="card"><h3>Today's numbers</h3>
   <table><tr><th>Attempted</th><th>Correct</th><th>Accuracy</th><th>Best streak</th><th>Error book</th><th>Rank</th></tr>
   <tr><td>${S.seen}</td><td>${S.right}</td><td>${S.seen?Math.round(S.right/S.seen*100):0}%</td>
   <td>${S.best}</td><td>${S.wrong.length}</td><td>${rankOf(S.xp)}</td></tr></table>
   ${weak.length?`<p style="margin-top:12px">Most misses came from: <span class="hl">${weak.join(' and ')}</span>.
     Put those into tomorrow's warm-up.</p>`:''}</div>
  <div class="card"><h3>Write three things in the error book</h3>
   <p><b>1. Today's idea in my own words.</b><br>
   <span class="sub">Prompt (write your own): what are the four steps, and which two do most students skip?</span></p>
   <p><b>2. One mistake, and why.</b> Sort it:<br>
   <span class="badge">careless (knew it, slipped)</span><span class="badge">method missing</span>
   <span class="badge">stuck (knew the pieces)</span><span class="badge">never seen before</span><br>
   <span class="sub">Today, be honest: was a "careless" error really a <b>reading</b> error? Those are their own category in disguise.</span></p>
   <p><b>3. One starred problem</b>, with the date three days from now beside it: <span class="hl">October 18</span>.</p></div>
  <div class="card quiet">Then close the book, even if you want to keep going. <b>Wanting to keep going is a good sign</b> — save it for tomorrow.<br>
   Day 5 is <b>mixed review</b>: no new topic. Re-solve this week’s starred problems, then a timed 12-problem set from everything so far.</div>`;
}


/* ---------- iPad: on-screen keypad so the system keyboard never covers the question ---------- */
const COARSE=matchMedia('(pointer:coarse)').matches;
if(S.pad===undefined){S.pad=COARSE;save()}
const RO=()=>S.pad?'readonly':'';
let curIn=null;
const PAD=document.createElement('div');PAD.className='pad';document.body.appendChild(PAD);
PAD.innerHTML=['7','8','9','4','5','6','1','2','3','0','.','⌫']
  .map(k=>`<button onpointerdown="event.preventDefault();padKey('${k}')">${k}</button>`).join('')
  +`<button class="go" onpointerdown="event.preventDefault();padGo()">Enter ⏎</button>`;
function padKey(k){if(!curIn)return;
  curIn.value = k==='⌫' ? curIn.value.slice(0,-1) : curIn.value+k;
  tone(720,.035,'triangle',.07);}
function padGo(){if(curIn&&curIn.onkeydown)curIn.onkeydown({key:'Enter'})}
function showPad(on){PAD.classList.toggle('show',!!on);document.body.classList.toggle('padon',!!on)}
document.addEventListener('focusin',e=>{
  const el=e.target;
  if(el.tagName!=='INPUT')return;
  curIn=el;
  showPad(S.pad && el.id!=='expr');            // the Forge has its own card+operator keys
  setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),60);
});
document.addEventListener('focusout',()=>setTimeout(()=>{
  if(!document.querySelector('input:focus'))showPad(false)},120));
function togglePad(){S.pad=!S.pad;save();
  const b=document.getElementById('padbtn');if(b)b.textContent=S.pad?'⌨︎ Pad':'⌨︎ Type';
  document.querySelectorAll('input[type=text]').forEach(i=>i.readOnly=S.pad);
  showPad(S.pad&&!!document.querySelector('input:focus'));}
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0)
  navigator.serviceWorker.register('sw.js').catch(()=>{});

{const b=document.getElementById('padbtn');if(b)b.textContent=S.pad?'⌨︎ Pad':'⌨︎ Type'}
applyFs();hud();render();
</script>
